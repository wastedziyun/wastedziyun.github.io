<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#abd9df">
  <title>吉林大学鼎新广场 · 微缩模型</title>
  <style>
    :root {
      color-scheme: light;
      background: #abd9df;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 28%, #e1eff1 0%, #b6dce2 44%, #92c5d2 100%);
    }
    body {
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #scene {
      position: fixed;
      inset: 0;
    }
    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      outline: none;
      touch-action: none;
    }
    #scene canvas:active {
      cursor: grabbing;
    }
    #scene::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 44%, transparent 58%, rgba(45, 48, 44, 0.13) 100%);
      mix-blend-mode: multiply;
    }
    @media (prefers-reduced-motion: reduce) {
      #scene::after { display: none; }
    }
  </style>
</head>
<body>
  <div id="scene"></div>
